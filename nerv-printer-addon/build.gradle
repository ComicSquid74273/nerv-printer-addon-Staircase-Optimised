plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(jdk_version as int)
    }
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:${project.meteor_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.properties([
        "version": project.version,
        "mc_version": project.minecraft_version,
        "jdk_version": project.jdk_version
    ])

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
            "mc_version": project.minecraft_version,
            "jdk_version": project.jdk_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
    it.options.release = jdk_version as int
}

test {
    useJUnitPlatform()
}
